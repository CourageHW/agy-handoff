  <circle cx="176" cy="524" r="5" fill="#3fb950"/>
  <text x="288" y="529" text-anchor="middle" fill="#c9d1d9" font-family="Ubuntu, sans-serif" font-size="13.5" font-weight="bold">0 npm Dependencies</text>

  <rect x="445" y="506" width="310" height="36" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1"/>
