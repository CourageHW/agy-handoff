<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <!-- Background Canvas (GitHub Dark Dimmed / Slate) -->
  <rect x="0" y="0" width="1200" height="560" rx="18" fill="#0d1117"/>
  <rect x="2" y="2" width="1196" height="556" rx="16" fill="none" stroke="#30363d" stroke-width="2"/>

